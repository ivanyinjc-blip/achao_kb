<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阿超知识库 — 我的个人图书馆</title>
<meta name="description" content="24,071 本电子书,50 个主分类。本地静态搜索,极简风格。">
<link rel="preload" href="data/meta.json" as="fetch" crossorigin>
<style>
  :root {
    --bg:#fafaf9; --bg-card:#fff; --bg-soft:#f5f5f4; --bg-hover:#f0f0ee;
    --fg:#1c1917; --fg-soft:#57534e; --fg-faint:#a8a29e;
    --line:#e7e5e4; --line-soft:#f0eeed;
    --accent:#4f46e5; --accent-soft:#eef2ff; --accent-fg:#fff;
    --tag-bg:#f5f5f4; --tag-fg:#57534e;
    --tag-active-bg:#1c1917; --tag-active-fg:#fff;
    --danger:#dc2626; --ok:#059669; --warn:#d97706;
    --radius:6px; --radius-lg:10px;
    --shadow-sm:0 1px 2px rgba(0,0,0,.04);
    --shadow:0 1px 3px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04);
    --shadow-lg:0 4px 24px rgba(0,0,0,.08);
    --t:150ms cubic-bezier(.4,0,.2,1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0c0a09; --bg-card:#1c1917; --bg-soft:#292524; --bg-hover:#34302d;
      --fg:#fafaf9; --fg-soft:#d6d3d1; --fg-faint:#78716c;
      --line:#292524; --line-soft:#1c1917;
      --accent:#818cf8; --accent-soft:#1e1b4b;
      --tag-bg:#292524; --tag-fg:#d6d3d1;
      --tag-active-bg:#fafaf9; --tag-active-fg:#0c0a09;
    }
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;background:var(--bg);color:var(--fg);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
  button,input{font:inherit;color:inherit}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  .container{max-width:1100px;margin:0 auto;padding:0 24px}
  header{padding:56px 0 32px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 6px;font-size:28px;font-weight:600;letter-spacing:-.02em}
  h1 .badge{font-size:11px;color:var(--fg-faint);font-weight:400;margin-left:12px;letter-spacing:0}
  .subtitle{margin:0;color:var(--fg-soft);font-size:14px}

  /* 顶部工具栏 */
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:16px}
  .toolbar-left,.toolbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn-link{font-size:12px;color:var(--fg-soft);background:transparent;border:1px solid var(--line);padding:6px 12px;border-radius:var(--radius);cursor:pointer;transition:all var(--t)}
  .btn-link:hover{border-color:var(--fg-faint);color:var(--fg)}
  .btn-link.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
  .btn-link.primary:hover{background:#4338ca;border-color:#4338ca}

  /* 统计条 */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin:24px 0 24px}
  .stat{background:var(--bg);padding:14px 18px}
  .stat-num{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
  .stat-label{font-size:12px;color:var(--fg-soft);margin-top:2px}

  /* 搜索 */
  .search-wrap{position:relative;margin-bottom:14px}
  .search-input{width:100%;padding:13px 44px 13px 16px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--bg-card);font-size:15px;outline:none;transition:border-color var(--t),box-shadow var(--t)}
  .search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search-input::placeholder{color:var(--fg-faint)}
  .search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:0;background:transparent;color:var(--fg-faint);cursor:pointer;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:16px;line-height:1}
  .search-clear:hover{background:var(--bg-hover);color:var(--fg)}
  .search-wrap.has-query .search-clear{display:flex}
  .search-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--fg-soft);margin-bottom:14px}
  .search-meta button{border:0;background:transparent;color:var(--accent);cursor:pointer;padding:0}
  .search-meta button:hover{text-decoration:underline}

  /* Tag pills */
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px}
  .tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--bg-card);color:var(--tag-fg);cursor:pointer;font-size:12px;transition:all var(--t);user-select:none}
  .tag:hover{border-color:var(--fg-faint)}
  .tag.active{background:var(--tag-active-bg);color:var(--tag-active-fg);border-color:var(--tag-active-bg)}
  .tag-count{font-size:10px;opacity:.6;font-variant-numeric:tabular-nums}

  /* 卡片 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;padding-bottom:120px}
  .card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px 16px 12px;transition:border-color var(--t),box-shadow var(--t);position:relative}
  .card:hover{border-color:var(--fg-faint);box-shadow:var(--shadow)}
  .card.selected{border-color:var(--accent);background:var(--accent-soft)}
  .card-head{display:flex;gap:10px;align-items:flex-start}
  .card-check{margin-top:3px;accent-color:var(--accent);cursor:pointer;width:14px;height:14px;flex-shrink:0}
  .card-body{flex:1;min-width:0}
  .card-title{font-size:14px;font-weight:600;line-height:1.4;margin:0 0 4px;word-break:break-word}
  .card-author{font-size:12px;color:var(--fg-soft);margin:0 0 6px}
  .card-desc{font-size:12px;color:var(--fg-faint);margin:0 0 8px;line-height:1.4}
  .card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
  .card-tag{font-size:11px;color:var(--fg-soft);background:var(--bg-soft);padding:2px 8px;border-radius:999px}
  .card-formats{display:flex;gap:4px}
  .fmt{font-size:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--fg-faint);text-transform:uppercase;letter-spacing:.04em}
  .card-actions{display:flex;gap:6px;margin-top:10px}
  .btn{padding:6px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg-card);color:var(--fg);cursor:pointer;font-size:12px;transition:all var(--t);display:inline-flex;align-items:center;gap:4px;text-decoration:none}
  .btn:hover{border-color:var(--fg-faint);background:var(--bg-hover)}
  .btn-primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
  .btn-primary:hover{background:#4338ca;border-color:#4338ca;text-decoration:none}
  .btn-bookshelf{color:var(--fg-soft)}
  .btn-bookshelf.on{color:var(--accent)}

  .empty{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--fg-faint)}
  .empty-title{font-size:16px;color:var(--fg-soft);margin:0 0 4px}
  .empty-sub{font-size:13px;margin:0}

  /* 浮窗 */
  .fab{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:12px;transition:transform var(--t);z-index:100;font-size:13px}
  .fab.show{transform:translateX(-50%) translateY(0)}
  .fab-count{background:var(--accent);color:#fff;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
  .fab button{background:transparent;border:0;color:inherit;cursor:pointer;font-size:13px;padding:4px 8px;border-radius:4px}
  .fab button:hover{background:rgba(255,255,255,.1)}
  .fab .divider{width:1px;height:16px;background:rgba(255,255,255,.2)}

  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:var(--radius);font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all var(--t);z-index:200;max-width:80vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* Drawer */
  .drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity var(--t);z-index:300}
  .drawer-bg.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,90vw);background:var(--bg);border-left:1px solid var(--line);transform:translateX(100%);transition:transform var(--t);z-index:400;display:flex;flex-direction:column}
  .drawer.show{transform:translateX(0)}
  .drawer-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .drawer-title{font-size:16px;font-weight:600}
  .drawer-close{background:transparent;border:0;cursor:pointer;color:var(--fg-faint);font-size:20px;line-height:1;padding:4px}
  .drawer-close:hover{color:var(--fg)}
  .drawer-body{flex:1;overflow-y:auto;padding:16px 24px}
  .drawer-section{margin-bottom:16px}
  .drawer-section h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-faint);font-weight:600}
  .shelf-empty{color:var(--fg-faint);font-size:13px;padding:20px 0;text-align:center}
  .shelf-item{padding:10px 0;border-bottom:1px solid var(--line-soft);display:flex;gap:10px;align-items:flex-start}
  .shelf-item:last-child{border-bottom:0}
  .shelf-item-title{font-size:13px;font-weight:500;flex:1;min-width:0}
  .shelf-item-remove{background:transparent;border:0;color:var(--fg-faint);cursor:pointer;font-size:16px;padding:0;line-height:1}
  .shelf-item-remove:hover{color:var(--danger)}

  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:var(--fg-faint)}
  mark{background:#fef08a;color:inherit;padding:0 2px;border-radius:2px}
  @media (prefers-color-scheme: dark){mark{background:#713f12;color:#fef3c7}}
</style>
</head>
<body>

<header>
  <div class="container">
    <h1>阿超知识库 <span class="badge">我的个人图书馆</span></h1>
    <p class="subtitle">电子书下载宝库 · 离线静态搜索 · 链接跳转城通网盘</p>

    <div class="toolbar">
      <div class="toolbar-left">
        <button class="btn-link primary" id="bulkDownloadBtn">⬇ 下载完整数据包</button>
        <span class="btn-link" id="bulkDownloadInfo" style="border:0;cursor:default;font-size:11px;color:var(--fg-faint)"></span>
      </div>
      <div class="toolbar-right">
        <button class="btn-link" id="openBookshelfBtn">收藏夹 (<span id="bookshelfCount">0</span>)</button>
      </div>
    </div>

    <div class="stats" id="stats">加载中…</div>

    <div class="search-wrap" id="searchWrap">
      <input id="searchInput" class="search-input" type="text" placeholder="搜索书名、作者、分类或简介 · 多关键词用空格分隔" autocomplete="off" spellcheck="false">
      <button class="search-clear" id="searchClear" aria-label="清除">×</button>
    </div>

    <div class="search-meta">
      <span id="resultMeta">—</span>
      <span><button id="randomPickBtn">随机一本</button></span>
    </div>

    <div class="tags" id="tags"></div>
  </div>
</header>

<main>
  <div class="container">
    <div class="grid" id="grid"></div>
  </div>
</main>

<div class="fab" id="fab">
  <span>已选 <span class="fab-count" id="fabCount">0</span> 本</span>
  <span class="divider"></span>
  <button id="fabDownload">批量下载</button>
  <span class="divider"></span>
  <button id="fabExport">导出链接</button>
  <span class="divider"></span>
  <button id="fabClear">清空</button>
</div>

<div class="toast" id="toast"></div>

<div class="drawer-bg" id="drawerBg"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="drawer-title">收藏夹</div>
    <button class="drawer-close" id="drawerClose">×</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<script src="app.js"></script>
</body>
</html>
